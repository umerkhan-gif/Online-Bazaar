{% extends 'home/base.html' %}

{% block title %}
Add Product - OnlineBazar
{% endblock %}

{% block content %}

<section class="form-section">

    <div class="form-container">

        <h1>
            Add New Product
        </h1>

        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}


            <div class="form-group">

                <label>
                    Product Name
                </label>

                {{ form.name }}

            </div>


            <div class="form-group">

                <label>
                    Category
                </label>

                {{ form.category }}

            </div>


            <div class="form-group">

                <label>
                    Price
                </label>

                {{ form.price }}

            </div>


            <div class="form-group">

                <label>
                    Description
                </label>

                {{ form.description }}

            </div>


            <div class="form-group">

                <label>
                    Main Image
                </label>

                {{ form.image }}

            </div>


            <div class="form-group">

                <label>
                    Image 2
                </label>

                {{ form.image_2 }}

            </div>


            <div class="form-group">

                <label>
                    Image 3
                </label>

                {{ form.image_3 }}

            </div>


            <button
                type="submit"
                class="submit-button"
            >
                Add Product
            </button>

        </form>

    </div>

</section>

{% endblock %}
